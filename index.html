<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>寻物小助手 - 物品位置记录</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="寻物小助手">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/833/833300.png">
  
  <!-- Manifest Dynamic Injection -->
  <link id="manifest-placeholder" rel="manifest">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SheetJS CDN (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* Custom Scrollbar for list container */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex flex-col items-center pb-8">

  <!-- Header -->
  <header class="w-full max-w-md bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-boxes-packing text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">寻物小助手</h1>
    </div>
    <button id="exportBtn" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition active:scale-95 shadow">
      <i class="fa-solid fa-file-excel text-emerald-400 text-sm"></i>
      <span>导出 Excel</span>
    </button>
  </header>

  <main class="w-full max-w-md p-4 flex-1 flex flex-col gap-4">

    <!-- Add Item Form Card -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-500 mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-plus-circle text-indigo-500"></i> 新增存放记录
      </h2>
      <form id="itemForm" class="flex flex-col gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1" for="itemName">物品名称 <span class="text-rose-500">*</span></label>
          <input type="text" id="itemName" required placeholder="例如：备用钥匙、老花镜" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm transition">
        </div>

        <div>
          <label class="block text-xs text-slate-500 mb-1" for="itemLocation">存放位置 <span class="text-rose-500">*</span></label>
          <input type="text" id="itemLocation" required placeholder="例如：车库铁柜第二个抽屉" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm transition">
        </div>

        <div>
          <label class="block text-xs text-slate-500 mb-1" for="itemDate">存放/记录日期 <span class="text-rose-500">*</span></label>
          <input type="date" id="itemDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm transition">
        </div>

        <button type="submit" class="w-full mt-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition active:scale-[0.98] shadow-sm flex justify-center items-center gap-2">
          <i class="fa-solid fa-check"></i>
          <span>保存记录</span>
        </button>
      </form>
    </section>

    <!-- Search Card -->
    <section class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200">
      <div class="relative flex items-center">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="搜索物品名称或位置..." class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        <button id="clearSearch" class="hidden absolute right-3 text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </section>

    <!-- Items List Section -->
    <section class="flex-1 flex flex-col">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-semibold text-slate-500">全部物品 (<span id="totalCount">0</span>)</span>
        <span id="searchResultNotice" class="text-xs text-indigo-600 hidden">搜索结果</span>
      </div>

      <div id="itemList" class="flex flex-col gap-3">
        <!-- List Items will be injected here dynamically -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-slate-400">
        <i class="fa-solid fa-box-open text-5xl mb-3 text-slate-300"></i>
        <p class="text-sm font-medium" id="emptyText">暂无存放物品，快去添加吧！</p>
      </div>
    </section>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">提示内容</span>
  </div>

  <script>
    // --- 1. Dynamic Manifest & Service Worker Setup for PWA ---
    const manifestData = {
      "name": "寻物小助手",
      "short_name": "寻物",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f1f5f9",
      "theme_color": "#4f46e5",
      "icons": [
        {
          "src": "https://cdn-icons-png.flaticon.com/512/833/833300.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'item-tracker-v1';
          self.addEventListener('install', e => {
            e.waitUntil(self.skipWaiting());
          });
          self.addEventListener('activate', e => {
            e.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    // --- 2. Application Logic ---
    const STORAGE_KEY = 'my_stored_items_v1';
    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Elements
    const itemForm = document.getElementById('itemForm');
    const itemNameInput = document.getElementById('itemName');
    const itemLocationInput = document.getElementById('itemLocation');
    const itemDateInput = document.getElementById('itemDate');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearch');
    const itemList = document.getElementById('itemList');
    const emptyState = document.getElementById('emptyState');
    const emptyText = document.getElementById('emptyText');
    const totalCount = document.getElementById('totalCount');
    const exportBtn = document.getElementById('exportBtn');
    const searchResultNotice = document.getElementById('searchResultNotice');

    // Set today's date as default
    const setTodayDate = () => {
      const today = new Date().toISOString().split('T')[0];
      itemDateInput.value = today;
    };
    setTodayDate();

    // Toast Function
    function showToast(msg, iconClass = 'fa-solid fa-circle-check text-emerald-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.textContent = msg;
      toastIcon.className = iconClass;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // Save items to LocalStorage
    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // Render Items
    function renderItems(filterQuery = '') {
      const query = filterQuery.trim().toLowerCase();
      const filteredItems = items.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.location.toLowerCase().includes(query)
      );

      itemList.innerHTML = '';
      totalCount.textContent = items.length;

      if (query !== '') {
        searchResultNotice.classList.remove('hidden');
        clearSearchBtn.classList.remove('hidden');
      } else {
        searchResultNotice.classList.add('hidden');
        clearSearchBtn.classList.add('hidden');
      }

      if (filteredItems.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        if (query !== '') {
          emptyText.textContent = '没有找到匹配的物品';
        } else {
          emptyText.textContent = '暂无存放物品，快去添加吧！';
        }
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        // Render sorted by date descending
        filteredItems.sort((a, b) => new Date(b.date) - new Date(a.date));

        filteredItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex justify-between items-start gap-3 transition hover:shadow-md';
          
          card.innerHTML = `
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="font-bold text-slate-800 text-base truncate">${escapeHtml(item.name)}</h3>
              </div>
              <div class="flex items-start gap-1.5 text-indigo-600 text-sm font-medium mb-2">
                <i class="fa-solid fa-location-dot mt-1 shrink-0 text-xs"></i>
                <span class="break-all">${escapeHtml(item.location)}</span>
              </div>
              <div class="text-xs text-slate-400 flex items-center gap-1">
                <i class="fa-regular fa-calendar text-[11px]"></i>
                <span>${item.date}</span>
              </div>
            </div>
            <button onclick="deleteItem('${item.id}')" aria-label="删除物品" class="text-slate-300 hover:text-rose-500 active:text-rose-600 p-2 rounded-xl hover:bg-rose-50 transition shrink-0">
              <i class="fa-solid fa-trash-can text-lg"></i>
            </button>
          `;
          itemList.appendChild(card);
        });
      }
    }

    // HTML Sanitization
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // Add Item
    itemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newItem = {
        id: Date.now().toString(),
        name: itemNameInput.value.trim(),
        location: itemLocationInput.value.trim(),
        date: itemDateInput.value
      };

      items.unshift(newItem);
      saveItems();
      
      // Clear inputs
      itemNameInput.value = '';
      itemLocationInput.value = '';
      setTodayDate();
      
      // Clear search if actively searching
      searchInput.value = '';
      
      renderItems();
      showToast('物品已添加成功！');
    });

    // Delete Item
    window.deleteItem = function(id) {
      if (confirm('确定要删除这件物品记录吗？')) {
        items = items.filter(item => item.id !== id);
        saveItems();
        renderItems(searchInput.value);
        showToast('物品已成功删除', 'fa-solid fa-trash-can text-rose-400');
      }
    };

    // Search input listener
    searchInput.addEventListener('input', (e) => {
      renderItems(e.target.value);
    });

    // Clear search button
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      renderItems();
    });

    // Export to Excel
    exportBtn.addEventListener('click', () => {
      if (items.length === 0) {
        showToast('暂无记录可供导出', 'fa-solid fa-circle-exclamation text-amber-400');
        return;
      }

      // Format data for Excel
      const excelData = items.map((item, index) => ({
        "序号": index + 1,
        "物品名称": item.name,
        "存放位置": item.location,
        "记录日期": item.date
      }));

      // Create sheet & workbook using SheetJS
      const worksheet = XLSX.utils.json_to_sheet(excelData);
      
      // Auto adjust column widths
      worksheet['!cols'] = [
        { wch: 8 },  // 序号
        { wch: 20 }, // 物品名称
        { wch: 30 }, // 存放位置
        { wch: 15 }  // 记录日期
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "物品位置明细");

      // Generate filename with current date
      const today = new Date().toISOString().split('T')[0];
      const filename = `物品位置记录清单_${today}.xlsx`;

      // Trigger download
      XLSX.writeFile(workbook, filename);
      showToast('Excel 文件导出成功！');
    });

    // Initial Render
    renderItems();
  </script>
</body>
</html>
